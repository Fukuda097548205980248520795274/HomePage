<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>作品ページ一括生成ツール</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fff5e6; color: #333; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; background: #d4a373; color: #fff; border: none; border-radius: 8px; transition: 0.2s; }
        button:hover { background: #b0895c; }
    </style>
</head>
<body>
    <h2>ひだまり - 作品詳細ページ一括生成</h2>
    <p>下のボタンを押すと、全13個のHTMLファイルが自動的にダウンロードされます。</p>
    <button id="downloadBtn">全13ファイルを一括ダウンロード</button>
    <p style="font-size: 12px; color: #666; margin-top: 20px;">※ブラウザから複数ファイルのダウンロード許可を求められた場合は「許可」してください。</p>

    <script>
    // 作品データのリスト
    const projects = [
        { id: 'tsukiryu', title: '月龍 (3Dアクション)', desc: '就職活動作品として3ヶ月で制作した3D格闘ゲームです。協調AIを作成し、集団戦に特化した戦闘を可能にしました。', img1: 'tsukiryu_1.jpg', img2: 'tsukiryu_2.jpg' },
        { id: 'jitsuryoku', title: '実力行使 (3Dアクション)', desc: '「月龍」のもととなった作品です。1対1での戦闘を中心とした3Dアクションゲームとして開発しました。', img1: 'jitsuryokukoushi_1.jpg', img2: 'jitsuryokukoushi_2.jpg' },
        { id: 'messyWorld', title: 'MESSY WORLD (パズル)', desc: '3年チーム制作（4ヶ月）。タイトル画面のライティングや多数のエフェクトを駆使し、高品質な絵作りを目指しました。', img1: 'messyworld_1.jpg', img2: 'messyworld_2.jpg' },
        { id: 'aitaigasa', title: '相対傘 (3Dシューティング)', desc: '2年チーム制作。カメラワークを生かし、ボス着地時の演出など歌舞伎の力強い演技を表現しました。', img1: 'aitaigasa_1.jpg', img2: 'aitaigasa_2.jpg' },
        { id: 'snowshotshow', title: 'Snow Shot Show!! (3Dシューティング)', desc: '2年チーム制作。ビヘイビアツリーを利用してボスを作成し、狙いやすいようプレイヤーの視点を工夫しました。', img1: 'snowshotshow_1.jpg', img2: 'snowshotshow_2.jpg' },
        { id: 'gunspinner', title: 'GUN SPINNER (ワンボタンシューティング)', desc: '2年チーム制作。フィルムグレインや空気感のあるパーティクルで不気味な遺跡の雰囲気を演出しました。', img1: 'gunspinner_1.jpg', img2: 'gunspinner_2.jpg' },
        { id: 'wataru', title: 'わたる (アクションパズル)', desc: '10daysJamで制作。自身の企画をもとに、ゲームシステムやエディタも自作し、チーム開発しやすい環境を作りました。', img1: 'wataru_1.jpg', img2: 'wataru_2.jpg' },
        { id: 'moais', title: 'モアイズ (パズル)', desc: '10daysJamで制作。チームメンバーのためにエディタやエンジン層を担当し、エラーが起きないよう努めました。', img1: 'moais_1.jpg', img2: 'moais_2.jpg' },
        { id: 'yukidoke', title: 'ゆきどけ～ (2Dアクションパズル)', desc: '1年チーム制作（2ヶ月）。プログラマとプランナーを兼任し、デバッグと修正を重ねて自然な坂道の挙動を実現しました。', img1: 'yukidoke_1.jpg', img2: 'yukidoke_2.jpg' },
        { id: 'bakudan', title: '爆男子 (2Dアクション)', desc: '1年チーム制作。初めてパーティクルを導入し、ポップな爆発エフェクトを表現しました。', img1: 'bakudan_1.jpg', img2: 'bakudan_2.jpg' },
        { id: 'pikapika', title: 'ぴかぴか風船 (2Dアクションパズル)', desc: '1年チーム制作。システム全てを自作し、ゲーム性が面白いと高い評価をいただいた作品です。', img1: 'pikapika_1.jpg', img2: 'pikapika_2.jpg' },
        { id: 'hakuja', title: '白蛇 (2Dアクション)', desc: '1年個人制作。前作のジャスト回避をメインシステムに組み込んで制作した初めての2Dアクションです。', img1: 'hakuja_1.jpg', img2: 'hakuja_2.jpg' },
        { id: 'koinobori', title: 'こいのぼり (2Dシューティング)', desc: '1年個人制作（2ヶ月）。授業で習った基礎を固めて作った初めてのゲーム制作で、ジャスト回避などを実装しました。', img1: 'koinobori_1.jpg', img2: 'koinobori_2.jpg' }
    ];

    // HTMLテンプレート
    const getHtmlTemplate = (p) => `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${p.title} - ひだまり</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="fluff-container">
        <span class="fluff fluff-1">🌼</span>
        <span class="fluff fluff-2">🌱</span>
        <span class="fluff fluff-3">✨</span>
        <span class="fluff fluff-4">🌿</span>
    </div>

    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="icon">🌼</span>
                <h1>ひだまり</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="about.html">あいさつ</a></li>
                    <li><a href="projects.html" class="active">作品</a></li>
                    <li><a href="contact.html">アカウント</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main>
        <section class="card" style="text-align: center; padding: 40px 20px;">
            <h2><span class="title-icon">🎮</span> ${p.title}</h2>
            <p style="margin: 20px auto; max-width: 600px; line-height: 1.8; text-align: left;">${p.desc}</p>
            
            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px;">
                <img src="images/${p.img1}" alt="${p.title} スクリーンショット1" style="max-width: 100%; width: 350px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <img src="images/${p.img2}" alt="${p.title} スクリーンショット2" style="max-width: 100%; width: 350px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            </div>

            <a href="projects.html" style="display: inline-block; padding: 12px 30px; background: #fff5e6; color: #d4a373; text-decoration: none; border-radius: 30px; font-weight: bold; border: 2px solid #d4a373; transition: 0.2s;">← 作品一覧に戻る</a>
        </section>
    </main>

</body>
</html>`;

    document.getElementById('downloadBtn').addEventListener('click', () => {
        let delay = 0;
        projects.forEach(p => {
            setTimeout(() => {
                const blob = new Blob([getHtmlTemplate(p)], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = p.id + '.html'; // 例: tsukiryu.html
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, delay);
            delay += 250; // ブラウザがブロックしないよう0.25秒ずつずらしてダウンロード
        });
    });
    </script>
</body>
</html>
